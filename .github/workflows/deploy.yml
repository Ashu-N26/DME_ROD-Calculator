name: CI/CD – DME & ROD Tool

on:
  push:
    branches: [ main ]        # Trigger on every push to main
  pull_request:

jobs:
  build-test:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
      # 🧩 Step 1 – Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 🐍 Step 2 – Set up Python backend
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint backend syntax
        run: python -m py_compile backend/app.py

      # ⚙️ Step 3 – Build React frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend (ignore peer-dep conflicts)
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build

  deploy:
    name: Deploy to Render
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render using API
        uses: render-examples/render-deploy@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
