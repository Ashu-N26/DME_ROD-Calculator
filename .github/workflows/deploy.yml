name: CI/CD – DME & ROD Tool

on:
  push:
    branches: [ main ]        # Run only when pushing to main branch
  pull_request:

jobs:
  build-test:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repo
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Backend setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint backend syntax
        run: python -m py_compile backend/app.py

      # Step 3: Frontend setup and build (✅ Fixed npm install)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    name: Deploy to Render
    needs: build-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render using API
        uses: render-examples/render-deploy@v1
        with:
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
